version = 1
mode = "advise"

[[checks]]
id = "unit"
command = ["python", "-m", "unittest", "discover", "-s", "tests"]
applies_to = ["**/*.py"]
required_for = ["code"]
timeout_seconds = 300
env_allowlist = ["PYTHONPATH"]

[[checks]]
id = "distribution"
command = ["python", "scripts/validate_distribution.py"]
applies_to = ["plugins/**", "scripts/**", "tests/**", ".github/**", "*.md", "*.toml"]
required_for = ["release"]
timeout_seconds = 120
env_allowlist = ["PYTHONPATH"]
