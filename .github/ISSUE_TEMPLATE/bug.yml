name: Bug report
description: Report reproducible Agent Efficiency behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include prompts, code, raw commands, credentials, or private telemetry.
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Cursor
        - Codex
        - Standalone CLI
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor output
